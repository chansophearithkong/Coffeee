<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean & Bloom Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <a class="brand" href="#home"><span class="logo">☕</span><span>Bean & Bloom</span></a>
  <nav class="desktop-nav">
    <a href="#home">Home</a><a href="#about">About</a><a href="#menu">Menu</a><a href="#contact">Contact</a>
  </nav>
  <div class="header-actions">
    <a class="icon-btn" id="accountBtn" href="#login" title="Login">♙</a>
    <button class="icon-btn cart-btn" id="cartBtn">🛍<b id="cartCount">0</b></button>
    <button class="hamb" id="hamb">☰</button>
  </div>
</header>
<div class="mobile-menu" id="mobileMenu">
  <a href="#home">Home</a><a href="#about">About</a><a href="#menu">Menu</a><a href="#contact">Contact</a>
</div>

<main id="app"></main>

<div class="drawer-overlay" id="cartOverlay">
  <aside class="cart-drawer">
    <div class="drawer-head"><h3>Your Cart</h3><button id="closeCart">✕</button></div>
    <div id="cartContent"></div>
  </aside>
</div>

<div class="checkout-overlay" id="checkoutOverlay">
  <section class="checkout-modal">
    <button class="checkout-close" id="closeCheckout">✕</button>
    <div id="checkoutContent"></div>
  </section>
</div>

<footer>
  <div class="footer-main">
    <a class="brand" href="#home"><span class="logo">☕</span><span>Bean & Bloom</span></a>
    <p>Good coffee. Good moments. Every day.</p>
    <div class="footer-links"><a href="#about">About</a><a href="#menu">Menu</a><a href="#contact">Contact</a></div>
  </div>
  <div class="footer-bottom"><span>© 2026 Bean & Bloom Coffee</span><span>Made with ☕ in Cambodia</span></div>
</footer>
<script src="script.js"></script>
</body>
</html>
